stages:
  - build
  - test
  - coverage
  - deploy

linux-gcc-build:
  stage: build
  tags:
    - linux
  script:
    - mkdir build/
    - cd build
    - cmake ..
    - make -j
  artifacts:
    expire_in: 2 days
    paths:
      - build/bin/

linux-clang-build:
  stage: build
  tags:
    - linux
  script:
    - mkdir build/
    - cd build
    - CXX=clang++ cmake ..
    - make -j unittest_frontend unittest_scl
  artifacts:
    expire_in: 2 days
    paths:
      - build/bin/

windows-msvc-build:
  stage: build
  tags:
    - windows
  script:
    - premake5 vs2022
    - '& "${Env:ProgramFiles}\Microsoft Visual Studio\2022\Community\MSBuild\Current\Bin\amd64\msbuild.exe" gatery.sln'
  artifacts:
    expire_in: 2 days
    paths:
      - bin/

test-linux-frontend:
  stage: test
  needs: ["linux-gcc-build"]
  tags:
    - linux
  script:
    - build/bin/unittest_frontend -- --intel /opt/simModels/intel/ --xilinx /opt/simModels/xilinx/ --intelQuartus /opt/intelFPGA_pro/24.1/quartus/bin

test-linux-scl:
  stage: test
  needs: ["linux-gcc-build"]
  tags:
    - linux
  script:
    - build/bin/unittest_scl -- --intel /opt/simModels/intel/ --xilinx /opt/simModels/xilinx/ --intelQuartus /opt/intelFPGA_pro/24.1/quartus/bin

test-windows-frontend:
  stage: test
  needs: ["windows-msvc-build"]
  tags:
    - windows
  script:
    - .\bin\windows-x86_64-Debug\gatery-frontend-test.exe

test-windows-scl:
  stage: test
  needs: ["windows-msvc-build"]
  tags:
    - windows
  script:
    - .\bin\windows-x86_64-Debug\gatery-scl-test.exe

test-linux-coverage:
  stage: coverage
  needs: ["linux-gcc-build"]
  tags:
    - linux
  script:
    - mkdir cov
    - cd cov
    - cmake .. -DCMAKE_BUILD_TYPE=Debug -DTEST_COVERAGE=true
    - /usr/bin/time -o buildLog.txt -v make -j20 config=coverage
    - mkdir badges
    - anybadge -l "Build time (seconds)" -v $(cat buildLog.txt | grep "User time (seconds):" | cut -d' ' -f 4) --file badges/buildTime.svg
    - anybadge -l "Build max RSS (kB)" -v $(cat buildLog.txt | grep "Maximum resident set size (kbytes)" | cut -d' ' -f 6) --file badges/buildMaxRSS.svg
    - anybadge -l "Lines of Code" -v $(find ../ -type f \( -iname \*.cpp -o -iname \*.h -o -iname \*.hpp \) | xargs wc -l | tail -1 | cut -d' ' -f 2) --file badges/linesOfCode.svg
    - lcov --directory . --zerocounters
    - bin/gatery-frontend-test -- --intel /opt/simModels/intel/ --xilinx /opt/simModels/xilinx/ --intelQuartus /opt/intelFPGA_pro/24.1/quartus/bin
    - bin/gatery-scl-test -- --intel /opt/simModels/intel/ --xilinx /opt/simModels/xilinx/ --intelQuartus /opt/intelFPGA_pro/24.1/quartus/bin
    - lcov --directory . --capture --output-file unittest_coverage.info
    - lcov --remove unittest_coverage.info '/usr/*' --output-file unittest_coverage.info
    - lcov --remove unittest_coverage.info '*/source/external/*' --output-file unittest_coverage.info
    - anybadge --value=$(lcov --summary unittest_coverage.info | grep lines | cut -d' ' -f 4 | cut -d'%' -f 1) --file badges/coverage.svg coverage
    - mkdir coverageInfo
    - genhtml unittest_coverage.info -o coverageInfo/
#    - rm -rf /mnt/doxygenDocu/gateryCov/*
#    - cp -r cov/ /mnt/doxygenDocu/gateryCov
  artifacts:
    expire_in: 4 weeks
    paths:
        - cov/badges/
        - cov/coverageInfo/
        - doc/gen/
  only:
    - master

documentation-job:
  stage: deploy
  needs: ["test-linux-coverage"]
  tags:
    - documount
  script:
    - doxygen doc/Doxyfile
    - rsync -r --delete --checksum doc/gen/html/ /mnt/doxygenDocu/gatery
    - rsync -r --delete --checksum cov/coverageInfo /mnt/doxygenDocu/gateryCov
  only:
    - master
